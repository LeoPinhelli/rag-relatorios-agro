[project]
name = "rag-agro"
version = "0.1.0"
description = "RAG sobre relatórios públicos do mercado de grãos (Conab, USDA)"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.40",
  "google-genai>=1.0",
  "openpyxl>=3.1",
  "chromadb>=0.5",
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "reportlab>=4.0",
  "python-dotenv>=1.0",
  "streamlit>=1.38",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
